<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-label="CCS Commons architecture: the browser reaches Cloudflare, then Apache on the CCS VM, which proxies to a Node and Express API that keeps users, sessions and audit in SQLite and asks Google to check sign-in tokens." font-family="Poppins, system-ui, sans-serif" font-size="12" fill="currentColor" style="max-width:100%;height:auto">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <!-- CCS VM container -->
    <rect x="390" y="100" width="690" height="480" rx="12" stroke-dasharray="6 5" stroke-opacity=".55"/>
    <!-- browser -->
    <rect x="20" y="170" width="170" height="250" rx="10" fill="currentColor" fill-opacity=".05"/>
    <rect x="34" y="214" width="142" height="48" rx="6"/>
    <rect x="34" y="274" width="142" height="48" rx="6"/>
    <rect x="34" y="334" width="142" height="48" rx="6"/>
    <!-- cloudflare, apache -->
    <rect x="245" y="250" width="90" height="80" rx="8" fill="currentColor" fill-opacity=".05"/>
    <rect x="415" y="250" width="120" height="80" rx="8" fill="currentColor" fill-opacity=".05"/>
    <!-- node API (the part that decides) -->
    <rect x="600" y="210" width="200" height="160" rx="10" stroke="#2e9e6a" stroke-width="2.4" fill="#2e9e6a" fill-opacity=".10"/>
    <!-- sqlite cylinder -->
    <path d="M870 262v56c0 12 40 20 95 20s95-8 95-20v-56" fill="currentColor" fill-opacity=".05"/>
    <ellipse cx="965" cy="262" rx="95" ry="18" fill="currentColor" fill-opacity=".05"/>
    <!-- lower row -->
    <rect x="415" y="440" width="120" height="70" rx="8"/>
    <rect x="600" y="440" width="200" height="70" rx="8"/>
    <rect x="870" y="440" width="190" height="70" rx="8"/>
    <!-- external -->
    <rect x="600" y="20" width="200" height="56" rx="8" fill="currentColor" fill-opacity=".05"/>
    <rect x="20" y="500" width="300" height="70" rx="8" stroke-dasharray="3 4"/>
  </g>
  <!-- arrows -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="190" y1="290" x2="245" y2="290"/>
    <line x1="335" y1="290" x2="415" y2="290"/>
    <line x1="535" y1="290" x2="600" y2="290"/>
    <line x1="800" y1="290" x2="870" y2="290" marker-start="url(#a)"/>
    <path d="M700 76V210"/>
    <path d="M105 170V48H600"/>
    <line x1="475" y1="330" x2="475" y2="440"/>
    <line x1="700" y1="370" x2="700" y2="440"/>
    <line x1="965" y1="440" x2="965" y2="344"/>
    <line x1="105" y1="420" x2="105" y2="500" stroke-dasharray="3 4"/>
  </g>
  <!-- labels: arrows -->
  <g text-anchor="middle" font-size="11">
    <text x="217" y="268">2. POST</text><text x="217" y="282">HTTPS</text>
    <text x="375" y="282">HTTPS</text>
    <text x="567" y="282">proxy</text>
    <text x="835" y="282">read, write</text>
    <text x="355" y="40">1. sign in: Google returns an ID token</text>
    <text x="760" y="146" text-anchor="start">3. Google's public keys (cached) check the token</text>
    <text x="475" y="390" text-anchor="middle">/scgss/ skips Node</text>
    <text x="700" y="410" text-anchor="start" dx="8">reads pages</text>
    <text x="955" y="396" text-anchor="end">add, disable, import</text>
    <text x="113" y="468" text-anchor="start">links, tokens CSS</text>
  </g>
  <!-- labels: boxes -->
  <g text-anchor="middle">
    <text x="105" y="192" font-weight="600">Visitor's browser</text>
    <text x="105" y="234">Static pages</text><text x="105" y="250" font-size="11" fill-opacity=".75">HTML, CSS, JS</text>
    <text x="105" y="294">site.js</text><text x="105" y="310" font-size="11" fill-opacity=".75">hides cards by role</text>
    <text x="105" y="354">Sign in with Google</text><text x="105" y="370" font-size="11" fill-opacity=".75">button, ID token</text>
    <text x="290" y="285" font-weight="600">Cloudflare</text><text x="290" y="302" font-size="11" fill-opacity=".75">TLS, cache</text>
    <text x="475" y="283" font-weight="600">Apache</text><text x="475" y="300" font-size="11" fill-opacity=".75">TLS cert, proxy</text><text x="475" y="316" font-size="11" fill-opacity=".75">real visitor IP</text>
    <text x="700" y="234" font-weight="600">API: Node + Express</text>
    <text x="700" y="256" font-size="11">POST /auth/google</text>
    <text x="700" y="274" font-size="11">POST /auth/logout</text>
    <text x="700" y="292" font-size="11">GET /api/me, /healthz</text>
    <text x="700" y="310" font-size="11">GET pages, /assets</text>
    <text x="700" y="328" font-size="11">/protected: deny by default</text>
    <text x="700" y="352" font-size="11" fill-opacity=".75">127.0.0.1:3000, service ccs-portal</text>
    <text x="965" y="296" font-weight="600">SQLite ccs.db</text><text x="965" y="313" font-size="11" fill-opacity=".75">users, sessions, audit</text>
    <text x="475" y="470" font-weight="600">/scgss/ files</text><text x="475" y="488" font-size="11" fill-opacity=".75">public, Apache only</text>
    <text x="700" y="470" font-weight="600">Repo folder</text><text x="700" y="488" font-size="11" fill-opacity=".75">git pull: pages, assets/</text>
    <text x="965" y="470" font-weight="600">users.js (CLI)</text><text x="965" y="488" font-size="11" fill-opacity=".75">run on the VM by the admin</text>
    <text x="700" y="44" font-weight="600">Google</text><text x="700" y="62" font-size="11" fill-opacity=".75">Identity Services, DLSU accounts</text>
    <text x="170" y="530" font-weight="600">GitHub Pages</text><text x="170" y="548" font-size="11" fill-opacity=".75">Task Tracker, VO dashboard, ccs-design</text>
  </g>
  <text x="408" y="122" font-weight="600" font-size="12">CCS VM (Ubuntu)</text>
</svg>
