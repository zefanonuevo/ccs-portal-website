# Apache: pass everything to the Node server on this machine. Keep your existing SSL lines from Phase 4.
# Enable modules once:  sudo a2enmod proxy proxy_http headers
# Check, then reload:   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Merge these lines into your existing HTTPS virtual host (do not add a second host for the same name).
<VirtualHost *:443>
    ServerName YOUR-PORTAL-DOMAIN

    # ... your existing SSLEngine / SSLCertificateFile / SSLCertificateKeyFile lines stay here ...

    # Do NOT point DocumentRoot at the repo folder, and do not Alias any repo folder.
    # Apache would then serve files (such as protected/) without the sign-in check.
    # If Apache needs a DocumentRoot, use an empty folder.

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
